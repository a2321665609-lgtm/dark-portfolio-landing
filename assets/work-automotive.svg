<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89AACC"/>
      <stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="900" cy="150" r="220" fill="#4E85BF" opacity="0.18" filter="url(#blur)"/>
  <circle cx="150" cy="700" r="260" fill="#89AACC" opacity="0.12" filter="url(#blur)"/>
  <!-- Speed lines -->
  <g opacity="0.25" stroke="#89AACC">
    <line x1="0" y1="180" x2="300" y2="180" stroke-width="1.5"/>
    <line x1="0" y1="260" x2="220" y2="260" stroke-width="1"/>
    <line x1="0" y1="340" x2="400" y2="340" stroke-width="2"/>
    <line x1="1200" y1="500" x2="900" y2="500" stroke-width="1.5"/>
    <line x1="1200" y1="580" x2="980" y2="580" stroke-width="1"/>
  </g>
  <!-- Car silhouette -->
  <g transform="translate(320,300)">
    <path d="M 120 200 C 140 140 220 110 300 110 L 560 110 C 620 110 660 130 680 160 L 780 200 C 820 210 840 240 840 280 L 840 320 L 160 320 L 160 280 C 160 240 180 220 120 200 Z" fill="#0c0c0c" stroke="url(#car)" stroke-width="2.5"/>
    <path d="M 300 110 L 340 170 L 560 170 L 580 110 Z" fill="#4E85BF" opacity="0.35"/>
    <rect x="220" y="240" width="90" height="44" rx="22" fill="#1a1a1a" stroke="#89AACC" stroke-width="2"/>
    <rect x="500" y="240" width="90" height="44" rx="22" fill="#1a1a1a" stroke="#89AACC" stroke-width="2"/>
    <circle cx="265" cy="262" r="10" fill="#89AACC" opacity="0.7"/>
    <circle cx="545" cy="262" r="10" fill="#89AACC" opacity="0.7"/>
  </g>
  <rect x="160" y="560" width="880" height="4" rx="2" fill="url(#car)" opacity="0.5"/>
</svg>
