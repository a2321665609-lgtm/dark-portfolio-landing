<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89AACC"/>
      <stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Brand marks -->
  <g transform="translate(520,190)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#acc)" stroke-width="2"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#acc)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="28" fill="url(#acc)"/>
  </g>
  <text x="600" y="480" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="76" fill="url(#word)" letter-spacing="12">以太</text>
  <text x="600" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5a5a5a" letter-spacing="12">工作室</text>
  <line x1="540" y1="560" x2="660" y2="560" stroke="url(#acc)" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner accents -->
  <path d="M 140 120 L 140 200 M 140 120 L 220 120" stroke="#4E85BF" stroke-width="2" opacity="0.5"/>
  <path d="M 1060 680 L 1060 600 M 1060 680 L 980 680" stroke="#4E85BF" stroke-width="2" opacity="0.5"/>
  <g opacity="0.15" stroke="#89AACC">
    <circle cx="200" cy="620" r="40" fill="none"/>
    <circle cx="1000" cy="180" r="60" fill="none"/>
  </g>
</svg>
