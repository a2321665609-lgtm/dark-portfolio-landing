<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cdd4"/>
      <stop offset="1" stop-color="#8f959e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#89AACC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#89AACC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- Head silhouette -->
  <ellipse cx="600" cy="340" rx="150" ry="190" fill="url(#skin)"/>
  <ellipse cx="600" cy="330" rx="140" ry="180" fill="#b8bdc5"/>
  <!-- Hair -->
  <path d="M 460 320 C 440 160 520 100 600 100 C 680 100 760 160 740 320 C 720 220 660 200 600 200 C 540 200 480 220 460 320 Z" fill="#1a1a1a"/>
  <path d="M 460 320 C 430 240 470 150 540 120 C 490 180 490 260 480 320 Z" fill="#232323"/>
  <!-- Eye line -->
  <rect x="510" y="330" width="180" height="3" rx="1.5" fill="#3a3f46" opacity="0.6"/>
  <!-- Ear -->
  <ellipse cx="451" cy="400" rx="26" ry="40" fill="#a8adb6"/>
  <ellipse cx="760" cy="400" rx="26" ry="40" fill="#a8adb6"/>
  <!-- Shoulders -->
  <path d="M 380 720 C 390 580 460 520 600 520 C 740 520 810 580 820 720 Z" fill="#101010" stroke="#2e2e2e" stroke-width="2"/>
  <!-- Collar accent -->
  <path d="M 520 520 L 600 610 L 680 520" fill="none" stroke="#89AACC" stroke-width="3" opacity="0.6"/>
  <!-- Grain -->
  <g opacity="0.04" fill="#fff">
    <circle cx="200" cy="120" r="1"/><circle cx="350" cy="600" r="1"/><circle cx="900" cy="200" r="1"/>
    <circle cx="1050" cy="500" r="1"/><circle cx="100" cy="400" r="1"/><circle cx="800" cy="680" r="1"/>
  </g>
</svg>
