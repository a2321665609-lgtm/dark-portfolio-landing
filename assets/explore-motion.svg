<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89AACC"/>
      <stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <!-- Film strip -->
  <g fill="#111">
    <rect x="60" y="80" width="200" height="160" rx="10" stroke="#2e2e2e" stroke-width="1.5"/>
    <rect x="76" y="96" width="168" height="128" rx="4"/>
  </g>
  <!-- Frame content -->
  <circle cx="160" cy="160" r="36" fill="none" stroke="url(#acc)" stroke-width="2"/>
  <rect x="130" y="130" width="60" height="60" fill="url(#acc)" opacity="0.35"/>
  <!-- Perforations -->
  <g fill="#333">
    <rect x="68" y="88" width="10" height="8" rx="2"/><rect x="86" y="88" width="10" height="8" rx="2"/>
    <rect x="104" y="88" width="10" height="8" rx="2"/><rect x="206" y="88" width="10" height="8" rx="2"/>
    <rect x="224" y="88" width="10" height="8" rx="2"/><rect x="242" y="88" width="10" height="8" rx="2"/>
    <rect x="68" y="224" width="10" height="8" rx="2"/><rect x="86" y="224" width="10" height="8" rx="2"/>
    <rect x="104" y="224" width="10" height="8" rx="2"/><rect x="206" y="224" width="10" height="8" rx="2"/>
    <rect x="224" y="224" width="10" height="8" rx="2"/><rect x="242" y="224" width="10" height="8" rx="2"/>
  </g>
  <!-- Play triangle -->
  <path d="M 148 138 L 148 182 L 186 160 Z" fill="#f2f2f2" opacity="0.85"/>
</svg>
