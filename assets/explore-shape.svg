<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89AACC"/>
      <stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <g fill="none" stroke="url(#acc)">
    <circle cx="160" cy="160" r="100" stroke-width="2"/>
    <circle cx="160" cy="160" r="66" stroke-width="1.5" opacity="0.6"/>
    <circle cx="160" cy="160" r="32" stroke-width="1" opacity="0.35"/>
  </g>
  <!-- Rhythm dashes -->
  <g stroke="#f2f2f2" opacity="0.7">
    <line x1="160" y1="60" x2="160" y2="82" stroke-width="2"/>
    <line x1="160" y1="238" x2="160" y2="260" stroke-width="2"/>
    <line x1="60" y1="160" x2="82" y2="160" stroke-width="2"/>
    <line x1="238" y1="160" x2="260" y2="160" stroke-width="2"/>
  </g>
  <circle cx="160" cy="160" r="12" fill="url(#acc)"/>
  <!-- Off-axis nodes -->
  <circle cx="218" cy="102" r="5" fill="#89AACC" opacity="0.6"/>
  <circle cx="102" cy="218" r="4" fill="#4E85BF" opacity="0.5"/>
</svg>
