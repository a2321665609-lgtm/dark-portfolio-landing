<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89AACC"/>
      <stop offset="1" stop-color="#4E85BF"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Calm horizon -->
  <rect x="30" y="110" width="140" height="2" fill="#3a3a3a"/>
  <rect x="40" y="132" width="120" height="1.5" fill="#2a2a2a"/>
  <!-- Sun -->
  <circle cx="100" cy="80" r="22" fill="url(#acc)" opacity="0.85"/>
  <circle cx="100" cy="80" r="34" fill="none" stroke="#4E85BF" stroke-width="1" opacity="0.25"/>
  <!-- Waves -->
  <path d="M 30 118 Q 50 112 70 118 T 110 118 T 150 118 T 170 118" fill="none" stroke="#89AACC" stroke-width="1.2" opacity="0.4"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="40" cy="40" r="1"/><circle cx="160" cy="50" r="1.2"/>
    <circle cx="30" cy="170" r="1"/><circle cx="175" cy="160" r="1"/>
  </g>
</svg>
